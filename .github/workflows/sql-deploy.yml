# MOZONA TPV — SQL Files Deploy
# Sincroniza archivos SQL a gh-pages para acceso público

name: Sync SQL to gh-pages

on:
  push:
    branches: [main]
    paths:
      - "database/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-sql:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Copy SQL files to gh-pages directory
        run: |
          mkdir -p dist/database
          cp database/*.sql dist/database/ 2>/dev/null || true
          cp database/*.md dist/database/ 2>/dev/null || true
          ls -la dist/database/

      - name: Commit SQL to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/database
          publish_branch: gh-pages
          force_orphan: false
          keep_files: true
          commit_message: "Sync SQL files @ ${{ github.sha }}"
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
