        <!-- ★ POLYFILLS RUNTIME para tablets antiguas (Android 4.4-7, Chrome 40-55) -->
        <script>
            // 1) globalThis (Node 12+ / Chrome 71+)
            if (typeof globalThis === 'undefined') {
                window.globalThis = window;
            }
            // 2) ResizeObserver (no existe en Safari < 13, Chrome < 64)
            if (typeof window.ResizeObserver === 'undefined') {
                window.ResizeObserver = class {
                    observe() {} unobserve() {} disconnect() {}
                };
            }
            // 3) structuredClone (Chrome 98+)
            if (typeof window.structuredClone === 'undefined') {
                window.structuredClone = function(o) { return JSON.parse(JSON.stringify(o)); };
            }
            // 4) Array.prototype.flat (Chrome 69+)
            if (!Array.prototype.flat) {
                Array.prototype.flat = function() {
                    var depth = arguments[0], arr = this;
                    depth = depth === undefined ? 1 : depth;
                    function flatten(a, d) {
                        if (d <= 0) return a.slice();
                        return [].concat.apply([], a.map(function(x) {
                            return Array.isArray(x) ? flatten(x, d - 1) : [x];
                        }));
                    }
                    return depth === Infinity ? (function loop(a) {
                        return [].concat.apply([], a.map(function(x) {
                            return Array.isArray(x) ? loop(x) : [x];
                        }));
                    })(arr) : flatten(arr, depth);
                };
            }
            // 5) Object.fromEntries (Chrome 73+)
            if (!Object.fromEntries) {
                Object.fromEntries = function(iter) {
                    var obj = {};
                    iter.forEach(function(kv) { obj[kv[0]] = kv[1]; });
                    return obj;
                };
            }
            // 6) String.prototype.replaceAll (Chrome 85+)
            if (!String.prototype.replaceAll) {
                String.prototype.replaceAll = function(s, r) {
                    return this.split(s).join(r);
                };
            }
        </script>

        <!-- ★ Captura de errores de arranque: solo registra en consola -->
        <script>
            window.__mozona_start_errors__ = [];
            window.addEventListener('error', function(e) {
                var msg = (e.error && e.error.stack) || (e.message + ' en ' + e.filename + ':' + e.lineno);
                window.__mozona_start_errors__.push(msg);
                console.error('[MOZONA] error de arranque:', msg);
            });
            window.addEventListener('unhandledrejection', function(e) {
                var msg = (e.reason && e.reason.stack) || String(e.reason);
                window.__mozona_start_errors__.push('PROMISE: ' + msg);
                console.error('[MOZONA] promise rechazada:', msg);
            });
        </script>
        <!-- ★ v1.9.40 - INVALIDACIÓN AGRESIVA DE CACHÉ PWA / SW -->
        <script>
        (function() {
            try {
                var CURRENT = 'v1.9.42-firebase-email-only';
                var LS_KEY  = 'mozona.build_version';
                var stored  = localStorage.getItem(LS_KEY);

                // ──────────────────────────────────────────────
                // 1) Si cambió la versión → limpieza TOTAL
                // ──────────────────────────────────────────────
                if (stored !== CURRENT) {
                    console.log('[v1.9.40] build changed:', stored, '→', CURRENT, '— LIMPIANDO TODO');

                    // localStorage (mantener solo críticos)
                    try {
                        Object.keys(localStorage).forEach(function(k) {
                            if (k.indexOf('mozona.') === 0
                                && k !== LS_KEY
                                && k !== 'mozona.cash_closures') {
                                localStorage.removeItem(k);
                            }
                        });
                    } catch (_) {}

                    // sessionStorage completo
                    try { sessionStorage.clear(); } catch (_) {}

                    // Desregistrar TODAS las SW (incluso las de la versión anterior)
                    if ('serviceWorker' in navigator) {
                        navigator.serviceWorker.getRegistrations().then(function(regs) {
                            regs.forEach(function(r) { r.unregister(); });
                            console.log('[v1.9.40] SW desregistrados:', regs.length);
                        });
                    }

                    // Borrar TODAS las caches PWA
                    if ('caches' in window) {
                        caches.keys().then(function(keys) {
                            keys.forEach(function(k) {
                                caches.delete(k);
                                console.log('[v1.9.40] cache borrada:', k);
                            });
                        });
                    }

                    // Marcar nueva versión ANTES de recargar
                    localStorage.setItem(LS_KEY, CURRENT);

                    // ★ Toast de aviso al usuario
                    try {
                        var toast = document.createElement('div');
                        toast.id = 'mozona-cache-toast';
                        toast.innerHTML =
                            '<div style="position:fixed;inset:0;z-index:99999;' +
                            'background:rgba(15,23,42,0.6);backdrop-filter:blur(4px);' +
                            'display:flex;align-items:center;justify-content:center;' +
                            'font-family:-apple-system,BlinkMacSystemFont,sans-serif">' +
                            '<div style="background:white;padding:24px 28px;border-radius:16px;' +
                            'max-width:340px;text-align:center;box-shadow:0 25px 50px rgba(0,0,0,0.25)">' +
                            '<div style="width:48px;height:48px;margin:0 auto 14px;border-radius:50%;' +
                            'background:#2563eb;display:flex;align-items:center;justify-content:center">' +
                            '<svg width="24" height="24" viewBox="0 0 24 24" fill="none"' +
                            ' stroke="white" stroke-width="2.5" stroke-linecap="round"' +
                            ' stroke-linejoin="round">' +
                            '<path d="M21 12a9 9 0 1 1-6.22-8.56"/><path d="M21 4v5h-5"/>' +
                            '</svg></div>' +
                            '<div style="font-size:15px;font-weight:800;color:#0f172a;margin-bottom:4px">' +
                            'Actualizando MOZONA TPV</div>' +
                            '<div style="font-size:12.5px;color:#64748b">' +
                            'Nueva versión detectada · Limpiando caché...</div>' +
                            '<div style="margin-top:14px;height:3px;background:#e2e8f0;' +
                            'border-radius:999px;overflow:hidden">' +
                            '<div style="height:100%;background:#2563eb;border-radius:999px;' +
                            'width:40%;animation:mozona-progress 1s linear infinite"></div>' +
                            '</div></div></div>' +
                            '<style>@keyframes mozona-progress{' +
                            '0%{margin-left:0;width:0%}50%{width:60%}' +
                            '100%{margin-left:100%;width:0%}}</style>';
                        (document.body || document.documentElement).appendChild(toast);
                    } catch (_) {}

                    // Recarga con cache-bust (forzar GET nuevo)
                    setTimeout(function() {
                        var url = location.href.split('?')[0].split('#')[0];
                        url += (url.indexOf('?') >= 0 ? '&' : '?') + 'v=' + CURRENT + '&t=' + Date.now();
                        console.log('[v1.9.40] reload con cache-bust →', url);
                        location.replace(url);
                    }, 1200);
                    return;
                }

                console.log('[v1.9.40] ya en versión correcta:', CURRENT);

                // ──────────────────────────────────────────────
                // 2) Si hay un SW con versión nueva en "waiting"
                //    → pedirle que se active inmediatamente
                // ──────────────────────────────────────────────
                if ('serviceWorker' in navigator) {
                    navigator.serviceWorker.getRegistration().then(function(reg) {
                        if (reg && reg.waiting) {
                            console.log('[v1.9.40] SW en waiting → skipWaiting');
                            try { reg.waiting.postMessage({ type: 'SKIP_WAITING' }); } catch (_) {}
                        }
                    });

                    // Detectar SW controllerchange (nuevo SW activado)
                    var refreshing = false;
                    navigator.serviceWorker.addEventListener('controllerchange', function() {
                        if (refreshing) return;
                        refreshing = true;
                        console.log('[v1.9.40] nuevo SW activado → recargando');
                        location.reload();
                    });
                }
            } catch (e) {
                console.error('[v1.9.40] error en auto-limpieza:', e);
            }
        })();
        </script>
