<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>MOZONA TPV — Cargando…</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
        body { margin: 0; padding: 0; font-family: -apple-system, system-ui, sans-serif; background: #F0F2F5; color: #1F2937; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .loader { text-align: center; }
        .spinner { width: 48px; height: 48px; border: 4px solid #E5E7EB; border-top-color: #2563EB; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 16px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        h1 { font-size: 18px; font-weight: 600; margin: 0 0 8px; }
        p { font-size: 14px; color: #6B7280; margin: 0; }
    </style>
    <script>
        // SPA fallback: redirige a / para que el router de React tome el control
        sessionStorage.redirect = location.pathname + location.search + location.hash;
        location.replace(location.origin + '/');
    </script>
</head>
<body>
    <div class="loader">
        <div class="spinner"></div>
        <h1>MOZONA TPV</h1>
        <p>Redirigiendo…</p>
    </div>
</body>
</html>
